                        for (let i = 1; i < rows.length; i++) {
                            let row = rows[i];
                            if (row.length < 10) continue;
                            let dong = row[0] ? row[0].trim() : '';
                            if (!DONG_ORDER.includes(dong)) continue; 

                            let pop = cleanNum(row[1]); let male = cleanNum(row[2]); let female = cleanNum(row[3]);
                            let youthPop = cleanNum(row[4]); let eldPop = cleanNum(row[5]);
                            let val6 = cleanNum(row[6]); let val7 = cleanNum(row[7]);
                            let onePop = val6 > 10 ? val6 : (val7 > 10 ? val7 : 0);
                            let ppHouse = (val6 > 0 && val6 < 10) ? val6 : ((val7 > 0 && val7 < 10) ? val7 : 0);
                            
                            let singleHousePct = cleanNum(row[8]); let multiHousePct = cleanNum(row[9]);
                            let aptPct = cleanNum(row[10]); let oldPct = cleanNum(row[11]);
                            let bizCount = cleanNum(row[12]); let bizWorker = cleanNum(row[13]);
                            let socEco = cleanNum(row[14]); let cult = cleanNum(row[15]);
                            let kin = cleanNum(row[16]); let wel = cleanNum(row[17]);
                            let pen = cleanNum(row[19]); let dis = cleanNum(row[20]);
                            let forgn = cleanNum(row[21]); let beds = cleanNum(row[23]);
                            let hosp = cleanNum(row[24]); let greenPct = cleanNum(row[25]);
                            let parkArea = cleanNum(row[26]); let acc = cleanNum(row[28]);

                            let youthPct = pop > 0 ? parseFloat(((youthPop / pop) * 100).toFixed(1)) : 0;
                            let eldPct = pop > 0 ? parseFloat(((eldPop / pop) * 100).toFixed(1)) : 0;
                            let onePct = pop > 0 ? parseFloat(((onePop / pop) * 100).toFixed(1)) : 0;

                            const ai = aiReports[dong] || {};
                            dongData[dong] = {
                                type: ai.type, strength: ai.strength, weakness: ai.weakness,
                                strategy: ai.strategy, festival: ai.festival, welfare: ai.welfare,
                                media: ai.media, safety: ai.safety,
                                pop, male, female, youthPop, youthPct, eldPop, eldPct,
                                ppHouse, onePop, onePct, singleHousePct, multiHousePct, aptPct, oldPct, 
                                bizCount, bizWorker, socEco, cult, kin, wel, pen, dis, forgn, beds, hosp, greenPct, parkArea, acc
                            };

                            totalCount++;
                            sumPop += pop; sumMale += male; sumFemale += female; 
                            sumYouthPop += youthPop; sumEldPop += eldPop;
                            sumVal6 += val6; sumVal7 += val7;
                            sumSingleHousePct += singleHousePct; sumMultiHousePct += multiHousePct;
                            sumAptPct += aptPct; sumOldPct += oldPct;
                            sumBizCount += bizCount; sumBizWorker += bizWorker;
                            sumSocEco += socEco; sumCult += cult; sumKin += kin; sumWel += wel;
                            sumPen += pen; sumDis += dis; sumForgn += forgn; sumBeds += beds;
                            sumHosp += hosp; sumGreenPct += greenPct; sumParkArea += parkArea; sumAcc += acc;
                        }

                        if (totalCount > 0) {
                            let avgPop = Math.round(sumPop / totalCount);
                            let avgYouthPop = Math.round(sumYouthPop / totalCount);
                            let avgEldPop = Math.round(sumEldPop / totalCount);
                            let avgOnePop = sumVal6 > (10 * totalCount) ? Math.round(sumVal6 / totalCount) : Math.round(sumVal7 / totalCount);
                            let avgPpHouse = (sumVal6 > 0 && sumVal6 < (10 * totalCount)) ? parseFloat((sumVal6 / totalCount).toFixed(2)) : parseFloat((sumVal7 / totalCount).toFixed(2));

                            let avgYouthPct = avgPop > 0 ? parseFloat(((avgYouthPop / avgPop) * 100).toFixed(1)) : 0;
                            let avgEldPct = avgPop > 0 ? parseFloat(((avgEldPop / avgPop) * 100).toFixed(1)) : 0;
                            let avgOnePct = avgPop > 0 ? parseFloat(((avgOnePop / avgPop) * 100).toFixed(1)) : 0;

                            const aiAvg = aiReports['동구 평균'] || {};
                            dongData['동구 평균'] = {
                                type: aiAvg.type, strength: aiAvg.strength, weakness: aiAvg.weakness,
                                strategy: aiAvg.strategy, festival: aiAvg.festival, welfare: aiAvg.welfare,
                                media: aiAvg.media, safety: aiAvg.safety,
                                pop: avgPop, male: Math.round(sumMale / totalCount), female: Math.round(sumFemale / totalCount), 
                                youthPop: avgYouthPop, youthPct: avgYouthPct, eldPop: avgEldPop, eldPct: avgEldPct,
                                ppHouse: avgPpHouse, onePop: avgOnePop, onePct: avgOnePct, 
                                singleHousePct: parseFloat((sumSingleHousePct / totalCount).toFixed(1)), 
                                multiHousePct: parseFloat((sumMultiHousePct / totalCount).toFixed(1)), 
                                aptPct: parseFloat((sumAptPct / totalCount).toFixed(1)), 
                                oldPct: parseFloat((sumOldPct / totalCount).toFixed(1)), 
                                bizCount: Math.round(sumBizCount / totalCount), 
                                bizWorker: Math.round(sumBizWorker / totalCount), 
                                socEco: Math.round(sumSocEco / totalCount), 
                                cult: Math.round(sumCult / totalCount), kin: Math.round(sumKin / totalCount), wel: Math.round(sumWel / totalCount), 
                                pen: Math.round(sumPen / totalCount), dis: Math.round(sumDis / totalCount), forgn: Math.round(sumForgn / totalCount), 
                                beds: Math.round(sumBeds / totalCount), hosp: Math.round(sumHosp / totalCount), 
                                greenPct: parseFloat((sumGreenPct / totalCount).toFixed(1)), 
                                parkArea: Math.round(sumParkArea / totalCount), acc: Math.round(sumAcc / totalCount)
                            };
                        }

                        document.getElementById('loading').classList.add('hidden');
                        document.getElementById('mainContent').classList.remove('hidden');
                        initApp();
                    } catch (e) {
                        document.getElementById('loading').innerHTML = `<div class="text-xl font-bold text-red-600 mb-2">데이터 분석 중 오류가 발생했습니다.</div><p class="text-gray-700">${e.message}</p>`;
                    }
                }
            });
        };

        function setupAgendaTabs() {
            document.querySelectorAll('.agenda-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.agenda-tab').forEach(t => {
                        t.classList.remove('active', 'text-indigo-600', 'bg-indigo-50', 'border-indigo-200', 'shadow-sm');
                        t.classList.add('text-gray-500', 'border-transparent');
                    });
                    this.classList.remove('text-gray-500', 'border-transparent');
                    this.classList.add('active', 'text-indigo-600', 'bg-indigo-50', 'border-indigo-200', 'shadow-sm');
                    currentAgendaTab = this.getAttribute('data-tab');
                    updateAgendaReport(document.getElementById('reportSelect').value);
                });
            });
        }

        function updateAgendaReport(dong) {
            const textEl = document.getElementById('agendaText');
            if (currentAgendaTab === 'raw') {
                textEl.innerHTML = rawAgendas[dong] || '<div class="text-center p-4 text-gray-500 font-bold">과거 원문 데이터가 없습니다.</div>';
            } else {
                textEl.innerHTML = (agendaReports[dong] && agendaReports[dong][currentAgendaTab]) ? agendaReports[dong][currentAgendaTab] : (agendaReports['동구 평균'][currentAgendaTab] || '데이터가 없습니다.');
            }
        }

        function renderUIElements() {
            const cbContainer = document.getElementById('checkboxContainer');
            const selContainer = document.getElementById('reportSelect');
            const compSelContainer = document.getElementById('complaintSelect');

            DONG_ORDER.forEach(dong => {
                if(dongData[dong]) {
                    cbContainer.innerHTML += `
                        <label class="flex items-center space-x-2 cursor-pointer hover:bg-white px-3 py-1.5 rounded-lg border border-transparent hover:border-emerald-200 transition shadow-sm bg-white break-keep">
                            <input type="checkbox" value="${dong}" class="dong-checkbox w-4 h-4 text-emerald-600 rounded">
                            <span class="text-gray-700 font-bold text-sm">${dong}</span>
                        </label>
                    `;
                    selContainer.options.add(new Option(dong, dong));
                    compSelContainer.options.add(new Option(dong, dong));
                }
            });
            
            // 민원 탭 셀렉트 박스에 '동구 평균(종합)' 옵션 추가
            compSelContainer.options.add(new Option('동구 평균 (전체 종합 요약)', '동구 평균'));

            document.querySelectorAll('.dong-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    if(e.target.checked) {
                        if(!checkedOrder.includes(e.target.value)) checkedOrder.push(e.target.value);
                    } else {
                        checkedOrder = checkedOrder.filter(val => val !== e.target.value);
                    }
                    updateChartsAndTable();
                });
            });

            selContainer.addEventListener('change', () => updateReport(selContainer.value));
            compSelContainer.addEventListener('change', () => renderComplaintCards(compSelContainer.value));
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            let html = '';
            DONG_ORDER.forEach(dong => { if(dongData[dong]) html += buildRow(dong, dongData[dong], false); });
            if(dongData['동구 평균']) html += buildRow('동구 평균', dongData['동구 평균'], true);
            tbody.innerHTML = html;
        }

        function buildRow(name, d, isAvg) {
            const bgClass = isAvg ? '!bg-[#ecfdf5]' : '!bg-white';
            const popBase = isAvg ? 'text-[1.05rem] font-black text-blue-800' : 'text-sm font-bold text-blue-600';
            const houseBase = isAvg ? 'text-[1.05rem] font-black text-amber-800' : 'text-sm font-bold text-amber-600';
            const bizBase = isAvg ? 'text-[1.05rem] font-black text-purple-800' : 'text-sm font-bold text-purple-600';
            const welBase = isAvg ? 'text-[1.05rem] font-black text-rose-700' : 'text-sm font-bold text-rose-500';
            const envBase = isAvg ? 'text-[1.05rem] font-black text-emerald-800' : 'text-sm font-bold text-emerald-600';
            const accBase = isAvg ? 'text-[1.05rem] font-black text-orange-800' : 'text-sm font-bold text-orange-600';
            const nameClass = isAvg ? 'text-base font-black text-emerald-900 break-keep' : 'text-sm font-bold text-gray-800 break-keep';

            return `
                <tr data-dong="${name}" class="${isAvg ? 'row-average' : 'hover:bg-gray-50 transition'} border-b border-gray-200">
                    <td class="px-4 py-3 sticky-col ${bgClass} ${nameClass} border-r border-gray-200">${name}</td>
                    <td class="px-4 py-3 ${popBase}">${Number(d.pop).toLocaleString()}</td>
                    <td class="px-4 py-3 ${popBase}">${Number(d.male).toLocaleString()}</td>
                    <td class="px-4 py-3 ${popBase}">${Number(d.female).toLocaleString()}</td>
                    <td class="px-4 py-3 ${popBase}">${Number(d.youthPop).toLocaleString()}</td>
                    <td class="px-4 py-3 ${popBase}">${Number(d.eldPop).toLocaleString()}</td>
                    <td class="px-4 py-3 ${popBase}">${Number(d.onePop).toLocaleString()}</td>
                    <td class="px-4 py-3 ${popBase}">${d.ppHouse}</td>
                    <td class="px-4 py-3 border-l-2 border-gray-200 ${houseBase}">${d.singleHousePct}%</td>
                    <td class="px-4 py-3 ${houseBase}">${d.multiHousePct}%</td>
                    <td class="px-4 py-3 ${houseBase}">${d.aptPct}%</td>
                    <td class="px-4 py-3 ${houseBase}">${d.oldPct}%</td>
                    <td class="px-4 py-3 border-l-2 border-gray-200 ${bizBase}">${Number(d.bizCount).toLocaleString()}</td>
                    <td class="px-4 py-3 ${bizBase}">${Number(d.bizWorker).toLocaleString()}</td>
                    <td class="px-4 py-3 ${bizBase}">${d.socEco}</td>
                    <td class="px-4 py-3 ${bizBase}">${d.cult}</td>
                    <td class="px-4 py-3 ${bizBase}">${d.kin}</td>
                    <td class="px-4 py-3 ${bizBase}">${d.wel}</td>
                    <td class="px-4 py-3 border-l-2 border-gray-200 ${welBase}">${Number(d.pen).toLocaleString()}</td>
                    <td class="px-4 py-3 ${welBase}">${Number(d.dis).toLocaleString()}</td>
                    <td class="px-4 py-3 ${welBase}">${Number(d.forgn).toLocaleString()}</td>
                    <td class="px-4 py-3 ${welBase}">${Number(d.beds).toLocaleString()}</td>
                    <td class="px-4 py-3 ${welBase}">${d.hosp}</td>
                    <td class="px-4 py-3 border-l-2 border-gray-200 ${envBase}">${d.greenPct}%</td>
                    <td class="px-4 py-3 ${envBase}">${d.parkArea}</td>
                    <td class="px-4 py-3 border-l-2 border-gray-300 ${accBase}">${d.acc}</td>
                </tr>
            `;
        }

        function initCharts() {
            ['theme1', 'theme2', 'theme3', 'theme4'].forEach(themeKey => {
                chartInstances[themeKey].bar = new Chart(document.getElementById(`barChart_${themeKey}`).getContext('2d'), { 
                    type: 'bar', 
                    data: { labels: [], datasets: [] }, 
                    options: { responsive: true, maintainAspectRatio: false } 
                });
                
                chartInstances[themeKey].radar = new Chart(document.getElementById(`radarChart_${themeKey}`).getContext('2d'), { 
                    type: 'radar', 
                    data: { labels: [], datasets: [] }, 
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        scales: { 
                            r: { 
                                min: 0, max: 100, 
                                ticks: { display: false, stepSize: 20 },
                                grid: { color: 'rgba(71, 85, 105, 0.15)', lineWidth: 1 },
                                angleLines: { color: 'rgba(71, 85, 105, 0.20)', lineWidth: 1 },
                                pointLabels: { font: { size: 10, weight: '700' }, color: '#334155' }
                            } 
                        },
                        plugins: {
                            legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, padding: 10, font: { weight: 'bold', size: 10 } } },
                            tooltip: {
                                backgroundColor: 'rgba(15, 23, 42, 0.9)',
                                padding: 10,
                                callbacks: {
                                    label: function(context) {
                                        const rawVal = context.dataset.rawData[context.dataIndex];
                                        return context.dataset.label + ': ' + rawVal + (context.chart.data.labels[context.dataIndex].includes('비율') || context.chart.data.labels[context.dataIndex].includes('%') ? '%' : '');
                                    }
                                }
                            },
                            datalabels: { display: false }
                        },
                        layout: { padding: 10 }
                    } 
                });
            });

        function updateReport(dong) {
            const data = dongData[dong];
            if(!data) return;
            document.getElementById('reportType').innerText = data.type;
            document.getElementById('strengthText').innerText = data.strength;
            document.getElementById('weaknessText').innerText = data.weakness;
            
            const themesFullContainer = document.getElementById('themesFullContainer');
            
            const themeMeta = [
                { key: 'strategy', label: '주민자치 및 공동체 활성화 전략', icon: 'fa-users-gear', color: 'border-l-emerald-500 bg-emerald-50/40 text-emerald-900' },
                { key: 'festival', label: '맞춤형 마을 축제 및 문화 기획', icon: 'fa-wand-magic-sparkles', color: 'border-l-blue-500 bg-blue-50/40 text-blue-900' },
                { key: 'welfare', label: '타겟 복지 및 돌봄 수요 체감도', icon: 'fa-handshake-angle', color: 'border-l-purple-500 bg-purple-50/40 text-purple-900' },
                { key: 'media', label: '미디어 홍보 및 소통 채널 제안', icon: 'fa-photo-film', color: 'border-l-indigo-500 bg-indigo-50/40 text-indigo-900' },
                { key: 'safety', label: '공간 정비 및 생활 안전 체계', icon: 'fa-shield-halved', color: 'border-l-amber-500 bg-amber-50/40 text-amber-900' }
            ];

            let htmlStr = '';
            themeMeta.forEach(theme => {
                htmlStr += `
                    <div class="p-4 rounded-xl border border-gray-200/80 shadow-sm relative overflow-hidden flex flex-col gap-1.5 ${theme.color}" style="border-left-width: 4px;">
                        <strong class="block text-[13.5px] font-black break-keep">
                            <i class="fa-solid ${theme.icon} mr-1"></i> 심층 테마 : ${theme.label}
                        </strong>
                        <p class="text-gray-800 text-[12.5px] leading-relaxed font-medium tracking-tight pl-5 break-keep">
                            ${data[theme.key] || '데이터 분석 수립 중'}
                        </p>
                    </div>
                `;
            });
            
            themesFullContainer.innerHTML = htmlStr;
            updateAgendaReport(dong);
        }

        function updateChartsAndTable() {
            const themesList = ['theme1', 'theme2', 'theme3', 'theme4'];
            const footnotes = {
                'theme1': '※ 산출내역: [유소년/고령/1인가구/외국인 비율] = (해당 인구 수 ÷ 총 인구 수) × 100',
                'theme2': '※ 산출내역: [아파트/단독/노후주택 비율] = (해당 주택 수 ÷ 전체 주택 수) × 100, [녹지비율] = (녹지 면적 ÷ 행정동 면적) × 100',
                'theme3': '※ 산출내역: [고령/기초연금/장애인 비율] = (해당 인구 수 ÷ 총 인구 수) × 100',
                'theme4': '※ 산출내역: [인구대비 종사자 비율] = (종사자 수 ÷ 총 인구 수) × 100, [세대당 인구] = 총 인구 수 ÷ 세대 수 (레이더 스케일 연동 보정치 반영)'
            };

            themesList.forEach(themeKey => {
                const barDs = [], radarDs = [];
                const currentCat = barChartCategories[themeKey];
                
                chartInstances[themeKey].bar.data.labels = currentCat.labels;
                chartInstances[themeKey].radar.data.labels = currentCat.labels;

                checkedOrder.forEach((dong, i) => {
                    const d = dongData[dong];
                    if(!d) return;
                    const col = colors[i % colors.length];
                    const rawData = currentCat.getData(d);
                    const radarData = rawData.map(val => Math.min(val, 100));

                    barDs.push({ label: dong, data: rawData, backgroundColor: col, borderRadius: 5 });
                    radarDs.push({ 
                        label: dong, 
                        data: radarData, 
                        rawData: rawData, 
                        borderColor: col, 
                        backgroundColor: col + '12',
                        pointBackgroundColor: '#fff', 
                        pointBorderColor: col, 
                        pointBorderWidth: 2, 
                        pointRadius: 3.5, 
                        borderWidth: 2.5, 
                        tension: 0.2 
                    });
                });
                
                const avg = dongData['동구 평균'];
                if(avg) {
                    const rawAvg = currentCat.getData(avg);
                    const radarAvg = rawAvg.map(val => Math.min(val, 100));

                    barDs.push({ label: '동구 평균', data: rawAvg, backgroundColor: '#10b98166', borderRadius: 5 });
                    radarDs.push({ 
                        label: '동구 평균', 
                        data: radarAvg, 
                        rawData: rawAvg, 
                        borderColor: '#10b981', 
                        borderDash: [4, 4], 
                        backgroundColor: 'rgba(16, 185, 129, 0.03)', 
                        pointBackgroundColor: '#fff', 
                        pointBorderColor: '#10b981', 
                        pointBorderWidth: 1.5, 
                        pointRadius: 3, 
                        borderWidth: 1.8, 
                        tension: 0.2 
                    });
                }

                chartInstances[themeKey].bar.data.datasets = barDs; 
                chartInstances[themeKey].bar.update();
                
                chartInstances[themeKey].radar.data.datasets = radarDs; 
                chartInstances[themeKey].radar.update();

                document.getElementById(`dynamicFootnote_${themeKey}`).innerText = footnotes[themeKey];

                const insightContainer = document.getElementById(`dynamicInsightContainer_${themeKey}`);
                if (checkedOrder.length === 0) {
                    insightContainer.innerHTML = '<span class="text-gray-400 text-xs break-keep">비교할 행정동을 선택하시면 해당 지역의 특이사항이 체크한 순서대로 요약되어 나타납니다.</span>';
                } else {
                    let htmlBoxes = '';
                    checkedOrder.forEach((dong, idx) => {
                        const col = colors[idx % colors.length];
                        const insightText = regionInsights[themeKey][dong] || "해당 테마의 특이사항을 분석 중입니다.";
                        
                        htmlBoxes += `
                            <div class="p-2.5 rounded-lg border bg-white flex items-start gap-2.5" style="border-left: 3.5px solid ${col}; border-color: #f1f5f9; border-left-color: ${col}; shadow-sm">
                                <span class="font-black whitespace-nowrap px-1.5 py-0.5 rounded text-white text-[10px]" style="background-color: ${col};">${dong}</span>
                                <p class="text-gray-700 font-semibold leading-relaxed text-[11px] break-keep">${insightText}</p>
                            </div>
                        `;
                    });
                    insightContainer.innerHTML = htmlBoxes;
                }
            });
        }

        function openModal(title, dataKey) {
            const modal = document.getElementById('chartModal');
            document.getElementById('modalTitle').innerText = ` 행정동별 비교 [ ${title} ]`;
            modal.classList.remove('hidden');
            const labels = [...DONG_ORDER, '동구 평균'];
            const dataVals = labels.map(dong => dongData[dong] ? dongData[dong][dataKey] : 0);
            if (modalChartInst) modalChartInst.destroy();
            modalChartInst = new Chart(document.getElementById('modalChart').getContext('2d'), {
                type: 'bar', 
                data: { 
                    labels: labels, 
                    datasets: [{ 
                        label: title, 
                        data: dataVals, 
                        backgroundColor: labels.map(l => l === '동구 평균' ? '#10b981' : '#3b82f6'), 
                        borderRadius: 8 
                    }] 
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { 
                        legend: { display: false },
                        navigator: { display: false },
                        datalabels: {
                            display: true,
                            anchor: 'end',
                            align: 'top',
                            formatter: function(value) {
                                return value.toLocaleString() + (title.includes('비율') || title.includes('율') ? '%' : (title.includes('인구') || title.includes('가구') || title.includes('수급') || title.includes('등록') || title.includes('남성') || title.includes('여성') || title.includes('유소년') || title.includes('고령') ? '명' : ''));
                            },
                            font: { weight: 'bold', size: 12 },
                            color: '#1e293b'
                        }
                    },
                    layout: { padding: { top: 35 } }
                }
            });
        }
    </script>
